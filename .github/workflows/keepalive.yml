# Free Supabase projects pause after about a week with no activity.
# This pings the database every 3 days so the site stays ready.
name: Keep database awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://yucsrluixfhkmdwzhbal.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_o7SUQUWtiDzPKIStZp2CpA__kpVNWo6" \
            -H "Content-Type: application/json" -d '{}'
